plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sugarstop.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sugarstop.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
